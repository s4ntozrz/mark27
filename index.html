<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md2Acad - Convetrsor Markdown para PDF</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
    <header class="topbar no-print">
        <h1>Md2Acad</h1>
        <div class="toolbar">
            <span id="word-count">0 palavras</span>
            <button id="btn-clear" class="btn btn-secondary">Limpar</button>
            <button id="btn-import" class="btn btn-secondary">Importar .md</button>
            <input type="file" id="file-input" accept=".md, .txt" style="display: none;">
            <button id="btn-print" class="btn btn-primary">Gerar PDF</button>
        </div>
    </header>

    <main class="container">
        <!-- Área do Editor -->
        <section class="editor-section no-print">
            <textarea id="markdown-input" placeholder="Cole ou digite seu Markdown aqui..."></textarea>
        </section>

        <!-- Área de Pré-visualização -->
        <section class="preview-section">
            <div id="document-preview" class="a4-page">
                <!-- Conteúdo renderizado aparecerá aqui -->
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/sanitizer.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/firebase-config.js"></script>
</body>
</html>
